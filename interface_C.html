<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interface D – Kamer 214</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--text:#f2f2f4;--muted:#8d8d96;--panel:#141417;--line:#26262c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0b0b0d;color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:20px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.tablet{width:min(1100px,100%)}
header{display:flex;justify-content:space-between;align-items:center;margin:0 4px 16px}
header h1{font-weight:600;font-size:22px}
header .temp{font-size:18px;font-weight:500}
.panels{display:grid;grid-template-columns:2.1fr 1fr;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px 22px 18px;display:flex;flex-direction:column}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.ptitle span{font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
.ptitle b{font-size:17px;font-weight:500}
.padwrap{display:grid;grid-template-columns:28px 1fr;gap:10px;flex:1}
.yaxis{display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:6px 0}
.yaxis em{font-style:normal;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.16em;color:#b9b9c2}
.pad{position:relative;aspect-ratio:1.08;border-radius:16px;cursor:crosshair;touch-action:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),#000),linear-gradient(to right,#ff8a12 0%,#ffc58a 35%,#fff1e2 65%,#e6ecff 100%)}
.knob{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);pointer-events:none}
.xaxis{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:12px 0 0 38px}
.xaxis i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 6px}
.xaxis strong{font-size:11px;letter-spacing:.16em;color:#b9b9c2;font-weight:600}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:10px}
.track{position:relative;width:56px;flex:1;min-height:300px;border-radius:28px;background:linear-gradient(to bottom,#ff3b3b,#c04aa0 45%,#6a4fe0 70%,#3048ff);cursor:ns-resize;touch-action:none;box-shadow:inset 0 0 0 1px #ffffff14}
.thumb{position:absolute;left:50%;transform:translate(-50%,-50%);background:#fff;color:#111;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.45);pointer-events:none}
@media (max-width:760px){.panels{grid-template-columns:1fr}.track{min-height:240px}}
/* ---- kamerbeeld ---- */
.roomview{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:12px;overflow:hidden}
.roomview svg{display:block;width:100%;height:auto;border-radius:16px}
.rv-flow{stroke-dasharray:10 14;animation:rvflow 1.4s linear infinite}
@keyframes rvflow{to{stroke-dashoffset:-48}}

.roomview{margin-top:20px;background:var(--panel);border-color:var(--line)}
</style>
</head>
<body>
<div class="tablet">
  <header><h1>Kamer 214</h1><div class="temp" id="hdrTemp">20,0°</div></header>
  <div class="panels">
    <div class="panel">
      <div class="ptitle"><span>LICHT</span><b id="lightVal">60 % · 3000 K</b></div>
      <div class="padwrap">
        <div class="yaxis"><span>fel</span><em>LICHTSTERKTE</em><span>dim</span></div>
        <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
      </div>
      <div class="xaxis"><span><i style="background:#ff8a12"></i>warm</span><strong>— LICHTKLEUR —</strong><span>koel<i style="background:#e6ecff"></i></span></div>
    </div>
    <div class="panel">
      <div class="ptitle"><span>TEMPERATUUR</span></div>
      <div class="tcol"><span>warmer</span><div class="track" id="track"><div class="thumb" id="thumb">20,0 °C</div></div><span>koeler</span></div>
    </div>
  </div>
<div class="roomview">
    <svg viewBox="0 0 1000 470" aria-label="Zicht op de kamer">
      <defs>
        <linearGradient id="rvWallB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9cfc0"/><stop offset="1" stop-color="#c7bba8"/></linearGradient>
        <linearGradient id="rvWallL" x1="0" x2="1"><stop offset="0" stop-color="#a99d8a"/><stop offset="1" stop-color="#c2b6a2"/></linearGradient>
        <linearGradient id="rvWallR" x1="1" x2="0"><stop offset="0" stop-color="#a99d8a"/><stop offset="1" stop-color="#c2b6a2"/></linearGradient>
        <linearGradient id="rvCeil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfc8bc"/><stop offset="1" stop-color="#e3ddd2"/></linearGradient>
        <linearGradient id="rvFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5a3e"/><stop offset="1" stop-color="#5a4029"/></linearGradient>
        <linearGradient id="rvSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1430"/><stop offset="1" stop-color="#22305a"/></linearGradient>
        <linearGradient id="rvDuvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f1ec"/><stop offset="1" stop-color="#d9d3ca"/></linearGradient>
        <linearGradient id="rvCurtain" x1="0" x2="1"><stop offset="0" stop-color="#5b6b7d"/><stop offset=".25" stop-color="#6f8094"/><stop offset=".5" stop-color="#56667a"/><stop offset=".75" stop-color="#6f8094"/><stop offset="1" stop-color="#56667a"/></linearGradient>
        <radialGradient id="rvGlow" cx="500" cy="150" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" id="rvG0"/><stop offset=".35" id="rvG1"/><stop offset="1" id="rvG2" stop-opacity="0"/></radialGradient>
        <radialGradient id="rvShadeOn" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="#fff"/><stop offset="1" id="rvS1"/></radialGradient>
        <linearGradient id="rvCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" id="rvC0"/><stop offset="1" id="rvC1" stop-opacity="0"/></linearGradient>
        <filter id="rvBlur"><feGaussianBlur stdDeviation="14"/></filter>
      </defs>
      <!-- architectuur -->
      <polygon points="0,0 1000,0 760,80 240,80" fill="url(#rvCeil)"/>
      <polygon points="0,0 240,80 240,330 0,470" fill="url(#rvWallL)"/>
      <polygon points="1000,0 760,80 760,330 1000,470" fill="url(#rvWallR)"/>
      <rect x="240" y="80" width="520" height="250" fill="url(#rvWallB)"/>
      <polygon points="240,330 760,330 1000,470 0,470" fill="url(#rvFloor)"/>
      <g stroke="#00000022">
        <path d="M330 330L170 470M420 330L340 470M500 330V470M580 330L660 470M670 330L830 470"/>
        <path d="M200 353H800M140 388H860M70 428H930" stroke="#00000018"/>
      </g>
      <polygon points="240,330 760,330 768,336 232,336" fill="#00000033"/>
      <!-- raam -->
      <rect x="560" y="112" width="160" height="150" fill="url(#rvSky)"/>
      <g fill="#ffd98a" opacity=".85"><circle cx="585" cy="236" r="1.6"/><circle cx="603" cy="228" r="1.4"/><circle cx="640" cy="240" r="1.6"/><circle cx="668" cy="232" r="1.3"/><circle cx="700" cy="242" r="1.6"/><circle cx="620" cy="246" r="1.2"/></g>
      <path d="M560 262V222h18v-14h16v24h20v-30h22v40h18v-22h20v12h26v30z" fill="#0a0f22"/>
      <circle cx="690" cy="140" r="9" fill="#f2efe2" opacity=".9"/>
      <rect id="rvFrost" x="560" y="112" width="160" height="150" fill="#cfe6ff" opacity="0"/>
      <rect x="560" y="112" width="160" height="150" fill="none" stroke="#f4f1ea" stroke-width="7"/>
      <path d="M640 112V262M560 187H720" stroke="#f4f1ea" stroke-width="4"/>
      <rect x="542" y="100" width="196" height="6" rx="3" fill="#6a5a48"/>
      <path d="M540 104h34v196h-34q8-50 0-98t0-98z" fill="url(#rvCurtain)"/>
      <path d="M740 104h-34v196h34q-8-50 0-98t0-98z" fill="url(#rvCurtain)"/>
      <!-- schilderij -->
      <rect x="318" y="118" width="120" height="72" fill="#3a4a5e" stroke="#2a2420" stroke-width="5"/>
      <path d="M321 175q30-30 55-8t60-14v24h-115z" fill="#c9a86b" opacity=".7"/>
      <!-- airco op linkermuur -->
      <polygon points="60,82 200,112 200,148 60,124" fill="#eceae5" stroke="#bdb7ad"/>
      <polygon points="60,124 200,148 200,154 60,132" fill="#c9c4bb"/>
      <g id="rvVents" stroke="#9a948a" stroke-width="2"><path d="M75 128L190 149"/></g>
      <rect id="rvLed" x="176" y="118" width="14" height="5" rx="2" transform="skewY(12)" fill="#6fdc9a"/>
      <g id="rvFlow" fill="none" stroke-width="3" stroke-linecap="round" opacity="0">
        <path class="rv-flow" d="M90 136 Q120 190 110 250"/>
        <path class="rv-flow" d="M135 144 Q170 200 165 265" style="animation-delay:-.5s"/>
        <path class="rv-flow" d="M180 152 Q215 205 220 270" style="animation-delay:-1s"/>
      </g>
      <!-- wandthermostaat-display -->
      <polygon points="150,210 205,220 205,262 150,254" fill="#2a2f3a" stroke="#bdb7ad"/>
      <text id="rvTemp" x="178" y="244" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2fb" transform="skewY(10) translate(0,-31)">21.0°</text>
      <!-- bed -->
      <rect x="282" y="210" width="236" height="122" rx="10" fill="#5b4632"/>
      <rect x="292" y="220" width="216" height="100" rx="6" fill="#6b5440"/>
      <rect x="236" y="268" width="44" height="62" fill="#6b5440"/><rect x="520" y="268" width="44" height="62" fill="#6b5440"/>
      <rect x="236" y="268" width="44" height="6" fill="#7d6550"/><rect x="520" y="268" width="44" height="6" fill="#7d6550"/>
      <polygon points="282,300 518,300 600,420 200,420" fill="url(#rvDuvet)"/>
      <polygon points="200,420 600,420 600,448 200,448" fill="#cfc8bd"/>
      <polygon points="230,362 570,362 600,420 200,420" fill="#8a9bb0"/>
      <polygon points="200,420 600,420 600,448 200,448" fill="#6f8094" opacity=".85"/>
      <ellipse cx="350" cy="296" rx="52" ry="18" fill="#fbf9f5"/><ellipse cx="450" cy="296" rx="52" ry="18" fill="#fbf9f5"/>
      <!-- kast rechts -->
      <polygon points="790,150 880,128 880,388 790,350" fill="#6b5440"/>
      <polygon points="790,150 880,128 880,388 790,350" fill="none" stroke="#00000033"/>
      <path d="M835 140V368" stroke="#00000044"/><circle cx="828" cy="250" r="3" fill="#c9a86b"/><circle cx="842" cy="252" r="3" fill="#c9a86b"/>
      <!-- donker (nacht) -->
      <rect id="rvDark" x="0" y="0" width="1000" height="470" fill="#05070f" opacity=".6"/>
      <!-- lichtbron -->
      <polygon id="rvConeP" points="470,150 530,150 720,470 280,470" fill="url(#rvCone)" opacity=".0"/>
      <rect x="0" y="0" width="1000" height="470" fill="url(#rvGlow)" style="mix-blend-mode:screen"/>
      <rect id="rvTint" x="0" y="0" width="1000" height="470" opacity="0" style="mix-blend-mode:soft-light"/>
      <path d="M500 22V112" stroke="#2b2b2b" stroke-width="2"/>
      <rect x="488" y="16" width="24" height="7" rx="2" fill="#bdb7ad"/>
      <circle id="rvBloom" cx="500" cy="135" r="60" filter="url(#rvBlur)" opacity="0"/>
      <path id="rvShade" d="M456 150C456 118 474 108 500 108S544 118 544 150Q500 156 456 150Z"/>
      <ellipse id="rvRim" cx="500" cy="151" rx="44" ry="4"/>
    </svg>
  </div>
</div>
<script>
function updateRoom(){
  if(typeof lamp==='undefined')return;
  const R=document.getElementById.bind(document);
  const c=COLORS[lamp.w],t=lamp.b/100,lit=lamp.on&&lamp.b>0,col=`rgb(${c})`;
  R('rvDark').setAttribute('opacity',lit?0.72-0.66*t:0.78);
  ['rvG0','rvG1','rvG2','rvC0','rvC1','rvS1'].forEach(id=>R(id).setAttribute('stop-color',col));
  R('rvG0').setAttribute('stop-opacity',lit?.25+.5*t:0);R('rvG1').setAttribute('stop-opacity',lit?.08+.22*t:0);
  R('rvC0').setAttribute('stop-opacity',.6);R('rvConeP').setAttribute('opacity',lit?.12+.3*t:0);
  R('rvShade').setAttribute('fill',lit?'url(#rvShadeOn)':'#57534c');
  R('rvRim').setAttribute('fill',lit?'#fffdf6':'#3f3c37');
  R('rvBloom').setAttribute('fill',col);R('rvBloom').setAttribute('opacity',lit?.3+.6*t:0);
  if(typeof temp==='undefined')return;
  const tv=Math.round(temp*2)/2,d=tv-21;
  R('rvTemp').textContent=tv.toFixed(1)+'°';
  const tc=d<0?'#3c8cff':'#ff7a2c';
  R('rvTint').setAttribute('fill',tc);R('rvTint').setAttribute('opacity',Math.min(.4,Math.abs(d)*.08));
  R('rvFrost').setAttribute('opacity',d<-2?Math.min(.45,(-d-2)*.12):0);
  const f=R('rvFlow');
  if(Math.abs(d)>=0.5){f.setAttribute('opacity',Math.min(1,.4+Math.abs(d)*.15));f.setAttribute('stroke',d<0?'#8cc4ff':'#ffae6b');R('rvLed').setAttribute('fill',d<0?'#4aa8ff':'#ff8a4c');}
  else{f.setAttribute('opacity',0);R('rvLed').setAttribute('fill','#6fdc9a');}
}
</script>
<script>
const $=id=>document.getElementById(id);
const COLORS=[[255,168,82]];           // wordt continu bijgewerkt
const lamp={on:true,b:60,w:0};
let temp=20,kx=.08;                    // kx: 0 = warm, 1 = koel
const K0=2700,K1=6500,MIN=16,MAX=28;
const STOPS=[[0,[255,138,18]],[.35,[255,197,138]],[.65,[255,241,226]],[1,[230,236,255]]];
function colorAt(x){for(let i=1;i<STOPS.length;i++){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];if(x<=b){const t=(x-a)/(b-a);return ca.map((v,j)=>Math.round(v+(cb[j]-v)*t));}}return STOPS[3][1];}
const fmt=v=>v.toFixed(1).replace('.',',');
function render(){
  const c=colorAt(kx),k=Math.round((K0+kx*(K1-K0))/100)*100;
  COLORS[0]=c;lamp.on=lamp.b>1;
  const kn=$('knob');kn.style.left=(kx*100)+'%';kn.style.top=(100-lamp.b)+'%';
  const f=.25+.75*lamp.b/100;kn.style.background=`rgb(${c.map(v=>Math.round(v*f))})`;
  $('lightVal').textContent=lamp.on?`${Math.round(lamp.b)} % · ${k} K`:'Uit';
  const p=(MAX-temp)/(MAX-MIN);$('thumb').style.top=(p*100)+'%';
  $('thumb').textContent=fmt(temp)+' °C';$('hdrTemp').textContent=fmt(temp)+'°';
  updateRoom();
}
function drag(el,fn){let on=false;const go=e=>{const r=el.getBoundingClientRect();fn(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)));render();};
  el.addEventListener('pointerdown',e=>{on=true;el.setPointerCapture(e.pointerId);go(e);});
  el.addEventListener('pointermove',e=>{if(on)go(e);});
  el.addEventListener('pointerup',()=>on=false);}
drag($('pad'),(x,y)=>{kx=x;lamp.b=Math.round((1-y)*100);});
drag($('track'),(x,y)=>{temp=Math.round((MAX-y*(MAX-MIN))*2)/2;});
render();
</script>
</body>
</html>
